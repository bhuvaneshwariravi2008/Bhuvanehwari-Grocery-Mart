<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard - Bhuvaneshwari Mart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <h1 class="section-title">🏪 Seller Dashboard</h1>

    <div class="stats" id="sellerStats"></div>

    <!-- Add / Edit product -->
    <section class="panel">
      <h2 id="formTitle">➕ Add New Product</h2>
      <form id="productForm">
        <div class="form-row">
          <div class="form-group">
            <label for="pName">Product Name (English)</label>
            <input type="text" id="pName" placeholder="e.g. Apple" required>
          </div>
          <div class="form-group">
            <label for="pTamil">Tamil Name (optional)</label>
            <input type="text" id="pTamil" placeholder="e.g. ஆப்பிள்">
          </div>
          <div class="form-group">
            <label for="pCategory">Category</label>
            <select id="pCategory" required>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="pPrice">Price (₹)</label>
            <input type="number" id="pPrice" min="1" step="0.5" placeholder="e.g. 120" required>
          </div>
          <div class="form-group">
            <label for="pUnit">Unit</label>
            <input type="text" id="pUnit" list="unitList" placeholder="kg / piece / dozen" value="kg" required>
            <datalist id="unitList">
              <option value="kg"></option>
              <option value="piece"></option>
              <option value="dozen"></option>
              <option value="bunch"></option>
              <option value="box"></option>
              <option value="pack"></option>
            </datalist>
          </div>
          <div class="form-group">
            <label for="pStock">Stock Quantity</label>
            <input type="number" id="pStock" min="0" step="1" placeholder="e.g. 100" required>
          </div>
          <div class="form-group">
            <label for="pEmoji">Emoji Icon</label>
            <input type="text" id="pEmoji" maxlength="8" placeholder="🍎">
          </div>
        </div>
        <div class="form-group">
          <label for="pDesc">Description (optional)</label>
          <input type="text" id="pDesc" maxlength="500" placeholder="Short description">
        </div>
        <button type="submit" class="btn" id="saveBtn">Add Product</button>
        <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none">Cancel Edit</button>
      </form>
    </section>

    <!-- My products -->
    <section class="panel">
      <h2>📋 My Products</h2>
      <div class="form-group" style="max-width:320px">
        <input type="text" id="productFilter" placeholder="Filter my products by name...">
      </div>
      <div class="table-wrap" id="myProducts"></div>
    </section>

    <!-- Orders for my products -->
    <section class="panel">
      <h2>🧾 Orders for My Products</h2>
      <div class="table-wrap" id="sellerOrders"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/seller.js"></script>
</body>
</html>

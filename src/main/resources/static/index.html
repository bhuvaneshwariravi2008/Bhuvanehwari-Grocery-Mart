<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhuvaneshwari Mart - Fresh Fruits &amp; Vegetables</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Fresh Fruits &amp; Vegetables, Delivered Home 🌿</h1>
        <p>Order from Bhuvaneshwari Mart — farm fresh, best price, quick delivery.</p>
      </div>
      <div class="emoji-row">🍎🥕🍌🍅</div>
    </section>

    <div class="chips" id="chips">
      <button class="chip active" data-cat="">All</button>
      <button class="chip" data-cat="Fruits">🍎 Fruits</button>
      <button class="chip" data-cat="Vegetables">🥕 Vegetables</button>
    </div>

    <div class="result-info" id="resultInfo"></div>
    <div class="grid" id="productGrid"></div>
    <div id="noResults"></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>

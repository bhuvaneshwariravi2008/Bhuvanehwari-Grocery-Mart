<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bhuvaneshwari Mart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <div class="auth-wrap">
      <div class="auth-box">
        <h1>Welcome Back 👋</h1>
        <p class="sub">Login to Bhuvaneshwari Mart</p>

        <div class="tabs" id="roleTabs">
          <button type="button" class="tab active" data-role="BUYER">🛒 Buyer</button>
          <button type="button" class="tab" data-role="SELLER">🏪 Seller</button>
          <button type="button" class="tab" data-role="ADMIN">🛡️ Admin</button>
        </div>

        <div class="demo-hint" id="demoHint"></div>
        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" required>
          </div>
          <button type="submit" class="btn btn-block" id="loginBtn">Login</button>
        </form>

        <div class="auth-foot" id="registerLink">
          New here? <a href="register.html">Create an account</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

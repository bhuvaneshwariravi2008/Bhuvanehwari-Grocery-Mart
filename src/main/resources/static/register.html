<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Bhuvaneshwari Mart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <div class="auth-wrap">
      <div class="auth-box">
        <h1>Create Account 🌿</h1>
        <p class="sub">Join Bhuvaneshwari Mart</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="registerForm">
          <div class="form-group">
            <label>I want to join as</label>
            <div class="radio-row">
              <label><input type="radio" name="role" value="BUYER" checked> 🛒 Buyer</label>
              <label><input type="radio" name="role" value="SELLER"> 🏪 Seller</label>
            </div>
          </div>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone (10 digits)</label>
            <input type="tel" id="phone" placeholder="9876543210" pattern="[0-9]{10}" maxlength="10" required>
          </div>
          <div class="form-group">
            <label for="password">Password (min 6 characters)</label>
            <input type="password" id="password" placeholder="Create a password" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-block" id="regBtn">Register</button>
        </form>

        <div class="auth-foot">Already have an account? <a href="login.html">Login</a></div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>

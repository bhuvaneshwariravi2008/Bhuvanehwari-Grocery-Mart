# ============================================================
#  Bhuvaneshwari Mart - Configuration
# ============================================================
server.port=8080

# ---------- MySQL DATABASE ----------
# >>> ONLY CHANGE THE PASSWORD BELOW (and username if it is not root) <<<
spring.datasource.url=jdbc:mysql://localhost:3306/bhuvaneshwari_mart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=bhuvana2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Runs schema.sql (sets utf8mb4 so Tamil text and emoji are saved correctly)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ---------- JPA / Hibernate ----------
# Tables are created automatically on first run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
